<!-- Paste this into your EmailJS template (Content → Edit content → Code editor). -->
<div style="margin:0;padding:24px 12px;background:#F3F7FC;font-family:Segoe UI,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;">
    <tr>
      <td style="padding:0 4px 18px;">
        <img src="{{logo_url}}" width="170" alt="Hunter Recruitment Advisors" style="display:block;border:0;background:#ffffff;padding:6px 10px;border-radius:8px;" />
      </td>
    </tr>
    <tr>
      <td style="background:#ffffff;border-radius:18px;border:1px solid #E1E9F4;overflow:hidden;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr><td style="height:4px;background:#00377F;line-height:4px;font-size:0;">&nbsp;</td></tr>
          <tr>
            <td style="padding:28px 28px 8px;">
              <p style="margin:0 0 6px;color:#F26A26;font-size:13px;font-weight:700;">{{request_type}}</p>
              <h1 style="margin:0 0 6px;color:#0A1E3F;font-size:22px;line-height:1.25;font-weight:700;">{{requested_by}} sent a request</h1>
              <p style="margin:0;color:#62789A;font-size:14px;">Reference {{reference}}, submitted {{submitted_at}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px 6px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #E4EBF5;border-radius:12px;border-collapse:separate;">
                {{{details_html}}}
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:10px 28px 0;color:#62789A;font-size:13px;">{{attachments_note}}</td>
          </tr>
          <tr>
            <td style="padding:20px 28px 30px;">
              <a href="{{request_link}}" style="display:inline-block;background:#00377F;color:#ffffff;text-decoration:none;font-weight:600;font-size:14px;padding:12px 20px;border-radius:10px;">Open in Request Center</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 4px;color:#8A9BB5;font-size:12px;">Sent by the Request Center. Reply to this email to contact {{requested_by}} directly.</td>
    </tr>
  </table>
</div>
